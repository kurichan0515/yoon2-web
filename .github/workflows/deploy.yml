name: CI / Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -----------------------------------------------
  # Job 1: 型チェック・ビルド確認
  # -----------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: dummy-secret-for-build
          NEXTAUTH_URL: https://localhost
          # フロントエンド公開変数
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.REACT_APP_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID: 'AW-621590738'
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: 'ydVVCILc-eAbENLxsqgC'
          NEXT_PUBLIC_GOOGLE_ADS_PAGEVIEW_CONVERSION_LABEL: 'ydVVCILc-eAbENLxsqgC'
          NEXT_PUBLIC_GOOGLE_ADS_HOTPEPPER_CONVERSION_LABEL: 'glIBCLuF8J8cENLxsqgC'
          NEXT_PUBLIC_GOOGLE_ADS_LINE_CONVERSION_LABEL: 'PT4wCL6F8J8cENLxsqgC'
          NEXT_PUBLIC_GOOGLE_ADS_ENABLED: 'true'
          NEXT_PUBLIC_ADSENSE_ENABLED: 'true'
          NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: 'ca-pub-6862900859746528'
          NEXT_PUBLIC_ADSENSE_DEFAULT_SLOT: '2647640133'
          NEXT_PUBLIC_INSTAGRAM_URL: 'https://www.instagram.com/yoo.n.yoo.n/'
          NEXT_PUBLIC_LINE_URL: 'https://lin.ee/lyyKSqu'

  # -----------------------------------------------
  # Job 2: EC2 へデプロイ（CI通過後のみ）
  # -----------------------------------------------
  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/yoon2-web
            bash scripts/deploy.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::デプロイ失敗。EC2のログを確認してください"
          echo "::error::コマンド: docker compose logs web"
